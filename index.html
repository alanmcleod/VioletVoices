<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee7f8"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Violet Voices</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{--bg:#f6f1fb;--panel:#fff;--panel2:#fbf8fe;--ink:#292331;--muted:#746b7d;--line:#ddd2e9;--accent:#7456a3;--soft:#ebe2f5;--danger:#a64055;--warn:#8d651f;--shadow:0 8px 24px rgba(80,58,108,.1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:880px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:44px;height:44px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:25px}h1{font-size:1.35rem;margin:0}.subtitle,.small{color:var(--muted);font-size:.88rem}.toolbar,.playbar,.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.project-toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:-4px 0 14px}.project-toolbar .btn{width:100%;padding-left:8px;padding-right:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 13px;min-height:42px}.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.mode-switcher,.view-switcher{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.mode-button,.view-button{border:1px solid var(--line);border-radius:15px;padding:11px;background:#fff;color:var(--muted);font-weight:700}.active{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}.settings,.panel,.chord-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}.settings-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}label{display:block;color:var(--muted);font-size:.85rem}input[type=text],input[type=number],input[type=date],select,textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}.full{grid-column:1/-1}.status{min-height:1.2em;margin-top:9px;color:var(--muted);font-size:.9rem}.preserved{background:var(--soft);color:#5f477e;border-radius:10px;padding:9px 11px;margin-top:10px;font-size:.88rem}.chord-list{display:grid;gap:10px}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card-title{font-weight:700}.card-meta{color:var(--muted);font-size:.85rem}.voice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:10px}.voice{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.voice strong{display:block;color:var(--muted);font-size:.75rem}.analysis{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.badge{background:var(--soft);color:#5f477e;padding:4px 8px;border-radius:999px;font-size:.83rem}.badge.warn{background:#fff3d9;color:var(--warn)}.empty{text-align:center;color:var(--muted);padding:25px;border:1px dashed var(--line);border-radius:16px;background:#fff}.add-row{display:flex;justify-content:center;margin:14px 0}.stave-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:#fff}.stave-scroll svg{display:block}.practice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.practice-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px}.stat strong{display:block;font-size:1.35rem;color:var(--accent)}.entry{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.entry:first-child{border-top:0}dialog{border:0;border-radius:18px;padding:0;max-width:760px;width:calc(100% - 24px);box-shadow:0 30px 80px rgba(46,30,66,.35)}dialog::backdrop{background:rgba(32,23,43,.45)}.modal{padding:16px}.modal h2{margin:0 0 5px}.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.voice-editor{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:10px}.note-row{display:grid;grid-template-columns:.8fr 1fr .7fr;gap:6px}.modal-footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden,[hidden]{display:none!important}.share-menu{display:grid;gap:8px}.playing{outline:3px solid #9b83bc}.toggle-label{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:5px;background:#fff}.toggle-label input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
@media(max-width:680px){.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.editor-grid{grid-template-columns:1fr}.practice-summary{grid-template-columns:1fr}header{align-items:flex-start}}
@media(max-width:420px){.app{padding:12px}.project-toolbar{gap:6px}.project-toolbar .btn{font-size:.9rem;min-height:40px}.subtitle{max-width:230px}}
</style></head><body><div class="app">
<header><div class="brand"><div class="brand-mark">𝄞</div><div><h1>Violet Voices</h1><div class="subtitle">A flexible vocal-harmony sketchbook</div></div></div></header>
<nav class="mode-switcher"><button id="chordMode" class="mode-button active">Harmony</button><button id="practiceMode" class="mode-button">Practise log</button></nav>
<section id="harmonyPanel">
<div class="project-toolbar" id="headerActions"><button class="btn" id="newBtn" title="Start a new harmony project">New</button><label class="btn" style="display:flex;align-items:center;justify-content:center" title="Open a saved harmony project">Open<input id="importInput" type="file" accept=".json" hidden></label><button class="btn" id="exportBtn" title="Save this harmony project">Save</button><button class="btn" id="shareBtn" title="Share a readable version of this harmony project">Share</button></div>
<section class="settings"><div class="settings-grid">
<label class="full">Project name <span class="small">(optional)</span><input id="projectName" type="text" placeholder="e.g. The Holly King and the Ivy Queen"></label>
<label>Voicing<select id="voicing"></select></label><label>Key<select id="key"></select></label><label>Mode<select id="scaleMode"><option value="major">Major</option><option value="minor">Minor</option></select></label><label>Time<select id="time"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option><option>9/8</option><option>12/8</option></select></label>
<label>Tempo<input id="tempo" type="number" min="30" max="220"></label><label>Playback<select id="playback"><option value="detached">Detached</option><option value="normal">Normal</option><option value="legato">Legato</option></select></label><label>Sustain<span class="toggle-label"><span>Gentle overlap</span><input id="sustain" type="checkbox" aria-label="Sustain"></span></label><label>Duration labels<select id="durationLabels"><option value="names">Note names</option><option value="fractions">Values</option></select></label><label>Volume<input id="volume" type="range" min="0" max="100"></label>
</div><div id="preserved" class="preserved" hidden></div><div class="playbar"><button id="playAll" class="btn primary">▶ Play all</button><button id="stop" class="btn">■ Stop</button><button id="loop" class="btn">Loop: off</button></div><div id="status" class="status" aria-live="polite"></div></section>
<div class="view-switcher"><button id="cardsView" class="view-button active">Chord cards</button><button id="staveView" class="view-button">Stave view</button></div>
<section id="cardsPanel"><div id="chordList" class="chord-list"></div><div class="add-row"><button id="addChord" class="btn primary">＋ Add chord</button></div></section>
<section id="stavePanel" class="panel" hidden><div class="card-top"><h2 style="margin:0;font-size:1.1rem" id="staveTitle">Stave view</h2><button id="backCards" class="btn">Back to chord cards</button></div><div id="staveContent" class="stave-scroll" style="margin-top:10px"></div></section>
</section>
<section id="practicePanel" hidden><section class="panel"><div class="practice-summary"><div class="stat">Today<strong id="todayTotal">0 min</strong></div><div class="stat">This week<strong id="weekTotal">0 min</strong></div><div class="stat">All time<strong id="allTotal">0 min</strong></div></div><div class="practice-grid"><label>Date<input id="practiceDate" type="date"></label><label>Minutes<input id="practiceMinutes" type="number" min="1"></label><label>Activity<input id="practiceActivity" type="text" placeholder="Singing, piano…"></label><label>Instrument or voice<input id="practiceInstrument" type="text" placeholder="Tenor, glockenspiel…"></label><label class="full">Notes<textarea id="practiceNotes" rows="3"></textarea></label></div><div class="actions" style="margin-top:12px"><button id="addPractice" class="btn primary">Add practise entry</button><button id="exportPractice" class="btn">Save practise log</button></div></section><section class="panel"><h2 style="margin-top:0">Entries</h2><div id="practiceEntries"></div></section></section>
</div>
<dialog id="editor"><div class="modal"><h2 id="editorTitle">Add chord</h2><div class="small">Enter one note for each active voice. “Key” follows the project’s key signature.</div><div id="voiceEditors" class="editor-grid" style="margin-top:13px"></div><label style="margin-top:12px">Duration<select id="chordDuration"><option value="4">Semibreve</option><option value="3">Dotted minim</option><option value="2">Minim</option><option value="1.5">Dotted crotchet</option><option value="1">Crotchet</option><option value="0.5">Quaver</option></select></label><label style="margin-top:10px">Chord label <span class="small">(optional)</span><input id="chordLabel" type="text" placeholder="e.g. G7 or opening chord"></label><div class="modal-footer"><div><button id="deleteChord" class="btn danger">Delete chord</button></div><div class="actions"><button id="previewChord" class="btn">▶ Preview</button><button id="cancelEditor" class="btn">Cancel</button><button id="saveChord" class="btn primary">Save chord</button></div></div></div></dialog>
<dialog id="shareDialog"><div class="modal"><h2>Share progression</h2><div class="small">Choose a human-readable format.</div><div class="share-menu" style="margin-top:14px"><button id="nativeShare" class="btn primary">Share text</button><button id="copyText" class="btn">Copy text</button><button id="saveText" class="btn">Save text file</button><button id="closeShare" class="btn">Cancel</button></div></div></dialog>
<script>
(()=>{
const KEYS=["C","G","D","A","E","B","F♯","C♯","F","B♭","E♭","A♭","D♭","G♭"];
const SIG={G:{F:"#"},D:{F:"#",C:"#"},A:{F:"#",C:"#",G:"#"},E:{F:"#",C:"#",G:"#",D:"#"},B:{F:"#",C:"#",G:"#",D:"#",A:"#"},"F♯":{F:"#",C:"#",G:"#",D:"#",A:"#",E:"#"},"C♯":{F:"#",C:"#",G:"#",D:"#",A:"#",E:"#",B:"#"},F:{B:"b"},"B♭":{B:"b",E:"b"},"E♭":{B:"b",E:"b",A:"b"},"A♭":{B:"b",E:"b",A:"b",D:"b"},"D♭":{B:"b",E:"b",A:"b",D:"b",G:"b"},"G♭":{B:"b",E:"b",A:"b",D:"b",G:"b",C:"b"}};
const REL={A:"C",E:"G",B:"D","F♯":"A","C♯":"E","G♯":"B","D♯":"F♯",D:"F",G:"B♭",C:"E♭",F:"A♭","B♭":"D♭","E♭":"G♭"};
const VOICES={S:{name:"Soprano",short:"S",staff:"treble",range:[60,81],default:{letter:"F",accidental:"key",octave:5}},S2:{name:"Soprano 2",short:"S2",staff:"treble",range:[60,79],default:{letter:"D",accidental:"key",octave:5}},A:{name:"Alto",short:"A",staff:"treble",range:[55,74],default:{letter:"D",accidental:"key",octave:4}},A2:{name:"Alto 2",short:"A2",staff:"treble",range:[53,72],default:{letter:"A",accidental:"key",octave:3}},T:{name:"Tenor",short:"T",staff:"bass",range:[48,67],default:{letter:"A",accidental:"key",octave:3}},T2:{name:"Tenor 2",short:"T2",staff:"bass",range:[45,65],default:{letter:"F",accidental:"key",octave:3}},B:{name:"Bass",short:"B",staff:"bass",range:[40,60],default:{letter:"D",accidental:"key",octave:3}},B2:{name:"Bass 2",short:"B2",staff:"bass",range:[36,57],default:{letter:"A",accidental:"key",octave:2}},Solo:{name:"Solo voice",short:"Solo",staff:"treble",range:[48,81],default:{letter:"D",accidental:"key",octave:4}}};
const PRESETS={SATB:["S","A","T","B"],Solo:["Solo"],SA:["S","A"],TB:["T","B"],SAB:["S","A","B"],SSA:["S","S2","A"],TTB:["T","T2","B"],SSAA:["S","S2","A","A2"],TTBB:["T","T2","B","B2"]};
const DUR_NAMES={4:"Semibreve",3:"Dotted minim",2:"Minim",1.5:"Dotted crotchet",1:"Crotchet",.5:"Quaver"},DUR_VAL={4:"1",3:"3/4",2:"1/2",1.5:"3/8",1:"1/4",.5:"1/8"},PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x)); let editIndex=null,looping=false,playToken=0,audioCtx=null,activeNodes=[],sampleBuffers=new Map(),samplePromises=new Map();
function blankVoice(id){return clone(VOICES[id].default)}
function blankChord(){const voices={};Object.keys(VOICES).forEach(v=>voices[v]=blankVoice(v));return{voices,duration:2,label:""}}
function defaultPiece(){return{name:"",voicing:"SATB",hiddenVoices:[],key:"D",mode:"major",time:"4/4",tempo:84,volume:75,playback:"normal",sustain:false,durationLabels:"names",chords:[blankChord()]}}
function migrate(p){p=p||defaultPiece();p.name??="";p.voicing=p.voicing||"SATB";p.hiddenVoices=Array.isArray(p.hiddenVoices)?p.hiddenVoices:[];p.playback=p.playback||p.playbackStyle||"normal";p.sustain=!!p.sustain;p.durationLabels=p.durationLabels||p.durationDisplay||"names";p.chords=(p.chords||[]).map(c=>{if(c.voices)return c;const v={};Object.keys(VOICES).forEach(id=>v[id]=blankVoice(id));if(c.notes){["S","A","T","B"].forEach((id,i)=>{if(c.notes[i])v[id]=c.notes[i]})}return{voices:v,duration:c.duration||2,label:c.label||""}});return p}
function load(){try{return migrate(JSON.parse(localStorage.getItem("violetVoicesPieceV2")||localStorage.getItem("violetVoicesPiece")))}catch(e){return defaultPiece()}}let piece=load();
function save(){localStorage.setItem("violetVoicesPieceV2",JSON.stringify(piece))}function active(){return PRESETS[piece.voicing]||PRESETS.SATB}function allUsed(){const s=new Set(active());piece.chords.forEach(c=>Object.keys(c.voices||{}).forEach(v=>s.add(v)));return [...s]}
function effKey(){return piece.mode==="major"?piece.key:(REL[piece.key]||"C")}function acc(n){return n.accidental==="key"?((SIG[effKey()]||{})[n.letter]||""):n.accidental}function midi(n){let p=PC[n.letter]+(acc(n)==="#"?1:acc(n)==="b"?-1:0);return(+n.octave+1)*12+(p+12)%12}function noteText(n){const a=acc(n);return n.letter+(a==="#"?"♯":a==="b"?"♭":a==="n"?"♮":"")+n.octave}function durText(d){return piece.durationLabels==="fractions"?(DUR_VAL[d]||d):(DUR_NAMES[d]||d)}function filename(ext){return(piece.name.trim()||"violet-voices-progression").replace(/[<>:"/\\|?*]+/g,"-").trim()+ext}
function setStatus(t){$("status").textContent=t}function visibleNotes(c){return active().map(v=>c.voices[v])}
function analyse(c){const ids=active(),notes=ids.map(v=>c.voices[v]),warn=[];ids.forEach((v,i)=>{const m=midi(notes[i]),r=VOICES[v].range;if(m<r[0]||m>r[1])warn.push(VOICES[v].short+" range")});for(let i=1;i<notes.length;i++)if(midi(notes[i-1])<midi(notes[i])){warn.push("Voice crossing");break}return warn}
function renderSelectors(){if(!$("key").options.length)KEYS.forEach(k=>$("key").add(new Option(k,k)));if(!$("voicing").options.length)Object.keys(PRESETS).forEach(v=>$("voicing").add(new Option(v==="Solo"?"Single voice":v,v)));$("projectName").value=piece.name;$("voicing").value=piece.voicing;$("key").value=piece.key;$("scaleMode").value=piece.mode;$("time").value=piece.time;$("tempo").value=piece.tempo;$("volume").value=piece.volume;$("playback").value=piece.playback;$("sustain").checked=!!piece.sustain;$("durationLabels").value=piece.durationLabels;const hidden=(piece.hiddenVoices||[]).filter(v=>!active().includes(v));$("preserved").hidden=!hidden.length;$("preserved").textContent=hidden.length?`Active voices: ${piece.voicing} · Hidden voices preserved: ${hidden.map(v=>VOICES[v].short).join(", ")}`:"";}
function render(){renderSelectors();$("loop").textContent=`Loop: ${looping?"on":"off"}`;const list=$("chordList");list.innerHTML="";if(!piece.chords.length){list.innerHTML='<div class="empty">No chords yet. Select “Add chord” to begin.</div>';return}piece.chords.forEach((c,i)=>{const card=document.createElement("article");card.className="chord-card";card.dataset.i=i;const voices=active().map(v=>`<div class="voice"><strong>${VOICES[v].short}</strong><span>${noteText(c.voices[v])}</span></div>`).join("");const badges=[c.label.trim()||"Chord "+(i+1),...analyse(c)].map((x,j)=>`<span class="badge ${j&&x!==c.label?"warn":""}">${esc(x)}</span>`).join("");card.innerHTML=`<div class="card-top"><div><div class="card-title">Chord ${i+1}</div><div class="card-meta">${durText(c.duration)}</div></div><button class="btn play-one" aria-label="Play chord ${i+1}">▶</button></div><div class="voice-grid">${voices}</div><div class="analysis">${badges}</div><div class="actions" style="margin-top:10px"><button class="btn edit">Edit</button><button class="btn dup">Duplicate chord</button><button class="btn insert">Insert after</button></div>`;list.appendChild(card)});if(!$("stavePanel").hidden)renderStave()}
function esc(s){return String(s||"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function openEditor(i=null,insertAt=null){editIndex=i;$("editor").dataset.insert=insertAt??"";const c=clone(i===null?blankChord():piece.chords[i]);$("editorTitle").textContent=i===null?(insertAt===null?"Add chord":"Insert chord"):"Edit chord "+(i+1);$("deleteChord").hidden=i===null;$("chordDuration").value=c.duration;$("chordLabel").value=c.label;const box=$("voiceEditors");box.innerHTML="";active().forEach(v=>{const n=c.voices[v]||blankVoice(v),d=document.createElement("section");d.className="voice-editor";d.dataset.voice=v;d.innerHTML=`<strong>${VOICES[v].name}</strong><div class="note-row" style="margin-top:7px"><label>Note<select class="letter">${"CDEFGAB".split("").map(x=>`<option ${x===n.letter?"selected":""}>${x}</option>`).join("")}</select></label><label>Accidental<select class="acc"><option value="key" ${n.accidental==="key"?"selected":""}>Key</option><option value="" ${n.accidental===""?"selected":""}>Natural</option><option value="#" ${n.accidental==="#"?"selected":""}>Sharp</option><option value="b" ${n.accidental==="b"?"selected":""}>Flat</option><option value="n" ${n.accidental==="n"?"selected":""}>Natural sign</option></select></label><label>Octave<select class="oct">${[2,3,4,5,6].map(x=>`<option ${x==n.octave?"selected":""}>${x}</option>`).join("")}</select></label></div>`;box.appendChild(d)});$("editor").showModal()}
function readChord(){const c=editIndex===null?blankChord():clone(piece.chords[editIndex]);$("voiceEditors").querySelectorAll(".voice-editor").forEach(d=>c.voices[d.dataset.voice]={letter:d.querySelector(".letter").value,accidental:d.querySelector(".acc").value,octave:+d.querySelector(".oct").value});c.duration=+$("chordDuration").value;c.label=$("chordLabel").value.trim();return c}
function changeVoicing(next){if(next===piece.voicing)return;const old=active(),nextIds=PRESETS[next],hidden=old.filter(v=>!nextIds.includes(v));let msg=hidden.length?`${hidden.map(v=>VOICES[v].name).join(" and ")} will be hidden, but their notes will be kept. Switch to ${next}?`:`Switch to ${next}? New voices will be added with starter notes.`;if(confirm(msg)){piece.hiddenVoices=[...new Set([...(piece.hiddenVoices||[]),...hidden])].filter(v=>!nextIds.includes(v));piece.voicing=next;piece.chords.forEach(c=>nextIds.forEach(v=>c.voices[v]??=blankVoice(v)));save();render();setStatus(`Voicing changed to ${next}.`)}else $("voicing").value=piece.voicing}
const PIANO_NOTES=["C","Cs","D","Ds","E","F","Fs","G","Gs","A","As","B"];
async function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")await audioCtx.resume();return audioCtx}
function sampleKey(targetMidi,layer){const octave=Math.floor(targetMidi/12)-1,name=PIANO_NOTES[targetMidi%12];return`${name}${octave}_${layer}`}
async function loadSample(targetMidi,layer){const key=sampleKey(targetMidi,layer);if(sampleBuffers.has(key))return sampleBuffers.get(key);if(samplePromises.has(key))return samplePromises.get(key);const promise=(async()=>{const ctx=await audio(),response=await fetch(`./piano/${key}.ogg`);if(!response.ok)throw new Error(`Could not load ${key}`);const buffer=await ctx.decodeAudioData(await response.arrayBuffer());sampleBuffers.set(key,buffer);samplePromises.delete(key);return buffer})().catch(err=>{samplePromises.delete(key);throw err});samplePromises.set(key,promise);return promise}
function stop(){playToken++;activeNodes.forEach(n=>{try{n.stop()}catch(e){}});activeNodes=[];document.querySelectorAll(".playing").forEach(x=>x.classList.remove("playing"));setStatus("Stopped.")}
function seconds(d){return+d*60/(+piece.tempo||84)}
async function playChord(c,duration=seconds(c.duration)){const ctx=await audio(),notes=visibleNotes(c),start=ctx.currentTime+.045,baseHold=duration*(piece.playback==="detached"?.78:piece.playback==="legato"?1.02:.94),sustain=piece.sustain?.12:0,release=piece.playback==="detached"?.12:.28;try{const prepared=await Promise.all(notes.map(async n=>{const target=midi(n);if(target<36||target>84)throw new Error("Note outside piano sample range");const [soft,loud]=await Promise.all([loadSample(target,"soft"),loadSample(target,"loud")]);return{n,target,soft,loud}}));const velocity=Math.max(0,Math.min(1,(+piece.volume||0)/100)),master=velocity*.82/Math.max(1,Math.sqrt(prepared.length)),softMix=Math.cos(velocity*Math.PI/2),loudMix=Math.sin(velocity*Math.PI/2);prepared.forEach(({soft,loud},i)=>{const jitter=Math.random()*.003,variation=.97+Math.random()*.06,noteStart=start+jitter,end=noteStart+baseHold+sustain+release;[[soft,softMix],[loud,loudMix]].forEach(([buffer,mix])=>{if(mix<.002||master<=0)return;const source=ctx.createBufferSource(),gain=ctx.createGain(),level=Math.max(.0001,master*mix*variation);source.buffer=buffer;gain.gain.setValueAtTime(level,noteStart);gain.gain.setValueAtTime(level,noteStart+baseHold+sustain);gain.gain.exponentialRampToValueAtTime(.0001,end);source.connect(gain).connect(ctx.destination);source.start(noteStart);source.stop(Math.min(end+.03,noteStart+buffer.duration));source.onended=()=>{activeNodes=activeNodes.filter(n=>n!==source)};activeNodes.push(source)})});setStatus(notes.map(noteText).join(" · "))}catch(err){console.error(err);setStatus("Piano sound could not be loaded. Check that the new piano folder is present.")}}
async function playAll(){stop();const token=++playToken;do{for(let i=0;i<piece.chords.length;i++){if(token!==playToken)return;const card=document.querySelector(`[data-i="${i}"]`);card?.classList.add("playing");await playChord(piece.chords[i]);await new Promise(r=>setTimeout(r,seconds(piece.chords[i].duration)*1000));card?.classList.remove("playing")}}while(looping&&token===playToken);setStatus("Playback finished.")}
function summary(){const lines=[];if(piece.name.trim())lines.push(piece.name.trim(),"");lines.push(`Voicing: ${piece.voicing}`,`Key: ${piece.key} ${piece.mode}`,`Time: ${piece.time}`,`Tempo: ${piece.tempo} bpm`,"");piece.chords.forEach((c,i)=>{lines.push(`${i+1}. ${c.label||"Chord"} (${durText(c.duration)})`);active().forEach(v=>lines.push(`   ${VOICES[v].short}: ${noteText(c.voices[v])}`));lines.push("")});return lines.join("\n")}
function download(text,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function staffY(n,staff){const idx=x=>+x.octave*7+"CDEFGAB".indexOf(x.letter),base=staff==="treble"?idx({letter:"E",octave:4}):idx({letter:"G",octave:2});return(staff==="treble"?104:224)-(idx(n)-base)*5}function noteSvg(n,x,staff,d){const y=staffY(n,staff),open=d>=2,stem=d<4,a=acc(n);let s=a?`<text x="${x-18}" y="${y+4}" font-size="11">${a==="#"?"♯":a==="b"?"♭":"♮"}</text>`:"";s+=`<ellipse cx="${x}" cy="${y}" rx="6.5" ry="4.6" transform="rotate(-18 ${x} ${y})" fill="${open?"white":"#292331"}" stroke="#292331"/>`;if(stem)s+=`<line x1="${x+6}" y1="${y}" x2="${x+6}" y2="${y-29}" stroke="#292331"/>`;return s}
function renderStave(){const ids=active(),hasTreble=ids.some(v=>VOICES[v].staff==="treble"),hasBass=ids.some(v=>VOICES[v].staff==="bass"),rows=[...(hasTreble?[{staff:"treble",top:64,clef:"𝄞"}]:[]),...(hasBass?[{staff:"bass",top:hasTreble?184:64,clef:"𝄢"}]:[])],cw=100,left=65,w=Math.max(720,left+piece.chords.length*cw+30),h=rows.length===2?280:165;$("staveTitle").textContent=piece.name.trim()||`${piece.voicing} stave view`;let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(piece.name||piece.voicing)} stave view"><rect width="${w}" height="${h}" fill="white"/>`;rows.forEach(r=>{for(let j=0;j<5;j++)s+=`<line x1="45" y1="${r.top+j*10}" x2="${w-20}" y2="${r.top+j*10}" stroke="#544c5c"/>`;s+=`<text x="8" y="${r.top+36}" font-size="44">${r.clef}</text>`});piece.chords.forEach((c,i)=>{const x=left+i*cw+35;s+=`<text x="${x}" y="22" text-anchor="middle" font-size="12" font-weight="700">${esc(c.label||`Chord ${i+1}`)}</text>`;ids.forEach((v,k)=>{const r=rows.find(x=>x.staff===VOICES[v].staff),original=r.staff==="bass"&&rows.length===1?64:r.top,shift=original-r.top;s+=noteSvg(c.voices[v],x+(k%2?9:-9),VOICES[v].staff,c.duration).replaceAll(`y="${staffY(c.voices[v],VOICES[v].staff)}`,`y="${staffY(c.voices[v],VOICES[v].staff)-shift}`)});});s+='</svg>';$("staveContent").innerHTML=s}
function mode(m){const p=m==="practice";$("harmonyPanel").hidden=p;$("practicePanel").hidden=!p;$("headerActions").hidden=p;$("chordMode").classList.toggle("active",!p);$("practiceMode").classList.toggle("active",p);localStorage.setItem("violetVoicesMode",m);if(p)renderPractice()}
function practices(){try{return JSON.parse(localStorage.getItem("violetVoicesPracticeLog")||"[]")}catch(e){return[]}}function savePractices(x){localStorage.setItem("violetVoicesPracticeLog",JSON.stringify(x))}function dateLocal(d=new Date()){return new Date(d-Date.prototype.getTimezoneOffset.call(d)*60000).toISOString().slice(0,10)}function renderPractice(){const entries=practices(),today=dateLocal(),weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-6);const start=dateLocal(weekAgo),sum=f=>entries.filter(f).reduce((a,x)=>a+(+x.minutes||0),0);$("todayTotal").textContent=sum(x=>x.date===today)+" min";$("weekTotal").textContent=sum(x=>x.date>=start&&x.date<=today)+" min";$("allTotal").textContent=sum(()=>true)+" min";$("practiceEntries").innerHTML=entries.length?entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((x,i)=>`<div class="entry"><div><strong>${esc(x.activity||"Practice")}</strong><div class="small">${x.date} · ${x.minutes} min${x.instrument?" · "+esc(x.instrument):""}</div>${x.notes?`<div class="small" style="margin-top:5px">${esc(x.notes)}</div>`:""}</div><button class="btn danger remove-practice" data-id="${x.id}">Delete</button></div>`).join(""):'<div class="small">No practise entries yet.</div>'}
$("projectName").addEventListener("input",e=>{piece.name=e.target.value;save()});$("voicing").addEventListener("change",e=>changeVoicing(e.target.value));["key","scaleMode","time","tempo","volume","playback","sustain","durationLabels"].forEach(id=>$(id).addEventListener("change",()=>{piece.key=$("key").value;piece.mode=$("scaleMode").value;piece.time=$("time").value;piece.tempo=+$("tempo").value||84;piece.volume=+$("volume").value;piece.playback=$("playback").value;piece.sustain=$("sustain").checked;piece.durationLabels=$("durationLabels").value;save();render()}));$("addChord").onclick=()=>openEditor();$("cancelEditor").onclick=()=>$("editor").close();$("saveChord").onclick=()=>{const c=readChord(),ins=$("editor").dataset.insert;if(editIndex!==null)piece.chords[editIndex]=c;else if(ins!=="")piece.chords.splice(+ins,0,c);else piece.chords.push(c);save();render();$("editor").close()};$("deleteChord").onclick=()=>{if(editIndex!==null&&confirm("Delete this chord?")){piece.chords.splice(editIndex,1);save();render();$("editor").close()}};$("previewChord").onclick=()=>playChord(readChord());$("chordList").onclick=e=>{const card=e.target.closest(".chord-card");if(!card)return;const i=+card.dataset.i;if(e.target.closest(".play-one"))playChord(piece.chords[i]);else if(e.target.closest(".edit"))openEditor(i);else if(e.target.closest(".dup")){piece.chords.splice(i+1,0,clone(piece.chords[i]));save();render()}else if(e.target.closest(".insert"))openEditor(null,i+1)};
$("playAll").onclick=playAll;$("stop").onclick=stop;$("loop").onclick=()=>{looping=!looping;render()};$("cardsView").onclick=()=>{$("cardsPanel").hidden=false;$("stavePanel").hidden=true;$("cardsView").classList.add("active");$("staveView").classList.remove("active")};$("staveView").onclick=()=>{$("cardsPanel").hidden=true;$("stavePanel").hidden=false;$("cardsView").classList.remove("active");$("staveView").classList.add("active");renderStave()};$("backCards").onclick=()=>$("cardsView").click();
$("newBtn").onclick=()=>{if(confirm("Start a new project? The current project remains safe only if you have saved it.")){stop();piece=defaultPiece();save();render()}};$("exportBtn").onclick=()=>download(JSON.stringify(piece,null,2),filename(".json"),"application/json");$("importInput").onchange=async e=>{try{piece=migrate(JSON.parse(await e.target.files[0].text()));save();render();setStatus("Project opened.")}catch(err){alert("That project file could not be opened.")}e.target.value=""};$("shareBtn").onclick=()=>$("shareDialog").showModal();$("closeShare").onclick=()=>$("shareDialog").close();$("saveText").onclick=()=>download(summary(),filename(".txt"),"text/plain");$("copyText").onclick=async()=>{try{await navigator.clipboard.writeText(summary());$("shareDialog").close();setStatus("Readable summary copied.")}catch(e){alert("Copying is unavailable here. Use Save text file instead.")}};$("nativeShare").onclick=async()=>{if(navigator.share){try{await navigator.share({title:piece.name||"Violet Voices progression",text:summary()});$("shareDialog").close()}catch(e){}}else alert("The share menu is unavailable here. Use Copy text or Save text file.")};
$("chordMode").onclick=()=>mode("harmony");$("practiceMode").onclick=()=>mode("practice");$("practiceDate").value=dateLocal();$("addPractice").onclick=()=>{const min=+$("practiceMinutes").value;if(!min)return alert("Enter the number of minutes.");const x=practices();x.push({id:Date.now(),date:$("practiceDate").value||dateLocal(),minutes:min,activity:$("practiceActivity").value.trim(),instrument:$("practiceInstrument").value.trim(),notes:$("practiceNotes").value.trim()});savePractices(x);$("practiceMinutes").value="";$("practiceNotes").value="";renderPractice()};$("practiceEntries").onclick=e=>{const b=e.target.closest(".remove-practice");if(!b)return;savePractices(practices().filter(x=>x.id!=b.dataset.id));renderPractice()};$("exportPractice").onclick=()=>download(JSON.stringify(practices(),null,2),"violet-voices-practise-log.json","application/json");
render();mode(localStorage.getItem("violetVoicesMode")||"harmony");if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
