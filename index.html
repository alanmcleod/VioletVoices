<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Violet Voices</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <style>
    :root{
      --bg:#f6f1fb;
      --panel:#ffffff;
      --panel2:#fbf8fe;
      --ink:#292331;
      --muted:#746b7d;
      --line:#ddd2e9;
      --accent:#7456a3;
      --accent2:#9b83bc;
      --accent-soft:#ebe2f5;
      --danger:#a64055;
      --warn:#8d651f;
      --ok:#3f7456;
      --shadow:0 8px 24px rgba(80,58,108,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:820px;margin:0 auto;padding:16px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:25px;border:1px solid var(--line)}
    h1{font-size:1.35rem;margin:0}
    .subtitle{color:var(--muted);font-size:.9rem;margin-top:2px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 13px;min-height:42px}
    .btn:hover{background:var(--panel2)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.danger{color:var(--danger)}
    .btn.icon{padding:9px 11px}
    .settings{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
    .settings-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
    label{font-size:.86rem;color:var(--muted);display:block}
    select,input[type="number"],input[type="text"]{width:100%;margin-top:5px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px}
    .playbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .status{font-size:.9rem;color:var(--muted);margin-top:10px;min-height:1.2em}
    .chord-list{display:grid;gap:10px}
    .chord-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 3px 10px rgba(80,58,108,.06)}
    .chord-card.playing{outline:3px solid var(--accent2);outline-offset:1px}
    .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .card-title{font-weight:700}
    .card-meta{font-size:.86rem;color:var(--muted)}
    .voice-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
    .voice{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
    .voice strong{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
    .voice span{font-size:1.05rem}
    .analysis{font-size:.85rem;color:var(--muted);margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
    .badge{padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:#5f477e}
    .badge.warn{background:#fff3d9;color:var(--warn)}
    .card-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
    .empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
    .add-row{display:flex;justify-content:center;margin:14px 0 6px}
    dialog{border:none;border-radius:18px;padding:0;max-width:700px;width:calc(100% - 24px);background:var(--panel);color:var(--ink);box-shadow:0 30px 80px rgba(46,30,66,.35)}
    dialog::backdrop{background:rgba(32,23,43,.45)}
    .modal{padding:16px}
    .modal h2{margin:0 0 4px;font-size:1.2rem}
    .modal-sub{color:var(--muted);font-size:.9rem;margin-bottom:14px}
    .editor-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .voice-editor{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel2)}
    .voice-editor h3{margin:0 0 8px;font-size:.96rem}
    .note-row{display:grid;grid-template-columns:1fr 1.15fr .8fr;gap:6px}
    .modal-footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
    .footer-left,.footer-right{display:flex;gap:8px;flex-wrap:wrap}
    .hidden{display:none!important}
    .small{font-size:.82rem;color:var(--muted)}
    @media(max-width:680px){
      .settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .editor-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .voice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      header{align-items:flex-start}
    }
    @media(max-width:420px){
      .app{padding:12px}
      .editor-grid{grid-template-columns:1fr}
      .settings-grid{grid-template-columns:1fr 1fr}
      .btn{padding:9px 11px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-mark">𝄞</div>
      <div>
        <h1>Violet Voices</h1>
        <div class="subtitle">A small SATB chord sketchbook</div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn icon" id="newPieceBtn" type="button">New</button>
      <button class="btn icon" id="exportBtn" type="button">Export</button>
      <label class="btn icon" style="display:inline-flex;align-items:center">
        Import
        <input id="importInput" type="file" accept=".json,application/json" hidden>
      </label>
    </div>
  </header>

  <section class="settings" aria-label="Piece settings">
    <div class="settings-grid">
      <label>Key
        <select id="keySelect"></select>
      </label>
      <label>Mode
        <select id="modeSelect">
          <option value="major">Major</option>
          <option value="minor">Minor</option>
        </select>
      </label>
      <label>Time
        <select id="timeSelect">
          <option>4/4</option><option>3/4</option><option>2/4</option>
          <option>6/8</option><option>9/8</option><option>12/8</option>
        </select>
      </label>
      <label>Tempo
        <input id="tempoInput" type="number" min="30" max="220" step="1" value="84">
      </label>
      <label>Volume
        <input id="volumeInput" type="range" min="0" max="100" step="1" value="75">
      </label>
    </div>
    <div class="playbar">
      <button class="btn primary" id="playAllBtn" type="button">▶ Play all</button>
      <button class="btn" id="stopBtn" type="button">■ Stop</button>
      <button class="btn" id="loopBtn" type="button">Loop: off</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </section>

  <main>
    <div id="chordList" class="chord-list"></div>
    <div class="add-row">
      <button class="btn primary" id="addChordBtn" type="button">＋ Add chord</button>
    </div>
  </main>
</div>

<dialog id="editorDialog">
  <div class="modal">
    <h2 id="editorTitle">Edit chord</h2>
    <div class="modal-sub">Choose one note for each voice. “Key” uses the piece’s key signature.</div>
    <div id="voiceEditors" class="editor-grid"></div>

    <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label>Duration
        <select id="durationSelect">
          <option value="4">Semibreve</option>
          <option value="3">Dotted minim</option>
          <option value="2">Minim</option>
          <option value="1.5">Dotted crotchet</option>
          <option value="1">Crotchet</option>
          <option value="0.5">Quaver</option>
        </select>
      </label>
      <label>Optional label
        <input id="labelInput" type="text" maxlength="30" placeholder="e.g. D major, I6">
      </label>
    </div>

    <div class="modal-footer">
      <div class="footer-left">
        <button class="btn" id="previewBtn" type="button">▶ Preview</button>
        <button class="btn danger" id="deleteBtn" type="button">Delete</button>
      </div>
      <div class="footer-right">
        <button class="btn" id="cancelBtn" type="button">Cancel</button>
        <button class="btn primary" id="saveBtn" type="button">Save chord</button>
      </div>
    </div>
  </div>
</dialog>

<script>
(() => {
  const KEYS = ["C","G","D","A","E","B","F♯","C♯","F","B♭","E♭","A♭","D♭","G♭"];
  const KEY_SIGS = {
    "C":{}, "G":{"F":"#"}, "D":{"F":"#","C":"#"}, "A":{"F":"#","C":"#","G":"#"},
    "E":{"F":"#","C":"#","G":"#","D":"#"}, "B":{"F":"#","C":"#","G":"#","D":"#","A":"#"},
    "F♯":{"F":"#","C":"#","G":"#","D":"#","A":"#","E":"#"},
    "C♯":{"F":"#","C":"#","G":"#","D":"#","A":"#","E":"#","B":"#"},
    "F":{"B":"b"}, "B♭":{"B":"b","E":"b"}, "E♭":{"B":"b","E":"b","A":"b"},
    "A♭":{"B":"b","E":"b","A":"b","D":"b"}, "D♭":{"B":"b","E":"b","A":"b","D":"b","G":"b"},
    "G♭":{"B":"b","E":"b","A":"b","D":"b","G":"b","C":"b"}
  };
  const MINOR_RELATIVE = {
    "A":"C","E":"G","B":"D","F♯":"A","C♯":"E","G♯":"B","D♯":"F♯","A♯":"C♯",
    "D":"F","G":"B♭","C":"E♭","F":"A♭","B♭":"D♭","E♭":"G♭"
  };
  const VOICES = ["Soprano","Alto","Tenor","Bass"];
  const VOICE_RANGES = {
    Soprano:[60,81], Alto:[55,74], Tenor:[48,67], Bass:[40,60]
  };
  const DUR_NAMES = {"4":"Semibreve","3":"Dotted minim","2":"Minim","1.5":"Dotted crotchet","1":"Crotchet","0.5":"Quaver"};
  const LETTER_PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};

  const keySelect = document.getElementById("keySelect");
  KEYS.forEach(k => keySelect.add(new Option(k,k)));

  const state = {
    piece: loadPiece(),
    editingIndex: null,
    audioCtx: null,
    masterGain: null,
    compressor: null,
    audioUnlocked: false,
    activeNodes: [],
    playToken: 0,
    loop: false
  };

  function blankChord() {
    return {
      notes: [
        {letter:"F", accidental:"key", octave:5},
        {letter:"D", accidental:"key", octave:4},
        {letter:"A", accidental:"key", octave:3},
        {letter:"D", accidental:"key", octave:3}
      ],
      duration: 2,
      label: ""
    };
  }

  function defaultPiece(){
    return { key:"D", mode:"major", time:"4/4", tempo:84, volume:75, chords:[blankChord()] };
  }

  function loadPiece(){
    try{
      const raw = localStorage.getItem("violetVoicesPiece");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return defaultPiece();
  }

  function savePiece(){
    localStorage.setItem("violetVoicesPiece", JSON.stringify(state.piece));
  }

  function effectiveKeyName(){
    if(state.piece.mode === "major") return state.piece.key;
    return MINOR_RELATIVE[state.piece.key] || "C";
  }

  function accidentalValue(note){
    if(note.accidental === "key"){
      return (KEY_SIGS[effectiveKeyName()] || {})[note.letter] || "";
    }
    return note.accidental;
  }

  function noteText(note){
    const a = accidentalValue(note);
    const symbol = a === "#" ? "♯" : a === "b" ? "♭" : a === "n" ? "♮" : "";
    return `${note.letter}${symbol}${note.octave}`;
  }

  function midiOf(note){
    let pc = LETTER_PC[note.letter];
    const acc = accidentalValue(note);
    if(acc === "#") pc += 1;
    if(acc === "b") pc -= 1;
    return (Number(note.octave)+1)*12 + ((pc+12)%12);
  }

  function freqOf(note){
    return 440 * Math.pow(2,(midiOf(note)-69)/12);
  }

  function chordAnalysis(chord, idx){
    const badges = [];
    const midis = chord.notes.map(midiOf);
    const warnings = [];
    VOICES.forEach((v,i)=>{
      const [lo,hi] = VOICE_RANGES[v];
      if(midis[i] < lo || midis[i] > hi) warnings.push(`${v} range`);
    });
    if(!(midis[0] >= midis[1] && midis[1] >= midis[2] && midis[2] >= midis[3])) warnings.push("Voice crossing");
    if(midis[0]-midis[1] > 12) warnings.push("S–A wide");
    if(midis[1]-midis[2] > 12) warnings.push("A–T wide");
    if(chord.label.trim()) badges.push({text:chord.label.trim(), warn:false});
    else badges.push({text:guessChordName(chord), warn:false});
    warnings.forEach(w=>badges.push({text:w,warn:true}));
    return badges;
  }

  function guessChordName(chord){
    const pcs = [...new Set(chord.notes.map(n=>((midiOf(n)%12)+12)%12))].sort((a,b)=>a-b);
    const bass = ((midiOf(chord.notes[3])%12)+12)%12;
    const namesSharp = ["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
    const patterns = [
      {ints:[0,4,7],suffix:""},
      {ints:[0,3,7],suffix:"m"},
      {ints:[0,4,7,10],suffix:"7"},
      {ints:[0,4,7,11],suffix:"maj7"},
      {ints:[0,3,7,10],suffix:"m7"},
      {ints:[0,3,6],suffix:"dim"}
    ];
    for(let root=0;root<12;root++){
      const rel = pcs.map(p=>(p-root+12)%12).sort((a,b)=>a-b);
      for(const p of patterns){
        if(rel.length===p.ints.length && rel.every((x,i)=>x===p.ints[i])){
          const inv = bass===root ? "" : `/${namesSharp[bass]}`;
          return namesSharp[root]+p.suffix+inv;
        }
      }
    }
    return "Unlabelled chord";
  }

  function durationSeconds(beats){
    return Number(beats) * (60/Number(state.piece.tempo || 84));
  }

  function render(){
    keySelect.value = state.piece.key;
    document.getElementById("modeSelect").value = state.piece.mode;
    document.getElementById("timeSelect").value = state.piece.time;
    document.getElementById("tempoInput").value = state.piece.tempo;
    document.getElementById("volumeInput").value = state.piece.volume ?? 75;
    document.getElementById("loopBtn").textContent = `Loop: ${state.loop ? "on" : "off"}`;

    const list = document.getElementById("chordList");
    list.innerHTML = "";
    if(!state.piece.chords.length){
      list.innerHTML = `<div class="empty">No chords yet. Add one and begin with the soprano note.</div>`;
      return;
    }
    state.piece.chords.forEach((chord, idx)=>{
      const card = document.createElement("article");
      card.className = "chord-card";
      card.dataset.index = idx;
      const voices = chord.notes.map((n,i)=>`
        <div class="voice"><strong>${["S","A","T","B"][i]}</strong><span>${noteText(n)}</span></div>
      `).join("");
      const badges = chordAnalysis(chord,idx).map(b=>`<span class="badge ${b.warn?"warn":""}">${b.text}</span>`).join("");
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-title">Chord ${idx+1}</div>
            <div class="card-meta">${DUR_NAMES[String(chord.duration)] || chord.duration+" beats"}</div>
          </div>
          <button class="btn icon play-one" type="button" aria-label="Play chord ${idx+1}">▶</button>
        </div>
        <div class="voice-grid">${voices}</div>
        <div class="analysis">${badges}</div>
        <div class="card-actions">
          <button class="btn edit-btn" type="button">Edit</button>
          <button class="btn duplicate-btn" type="button">Duplicate</button>
          <button class="btn insert-btn" type="button">Insert after</button>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function buildVoiceEditors(chord){
    const box = document.getElementById("voiceEditors");
    box.innerHTML = "";
    VOICES.forEach((voice,i)=>{
      const n = chord.notes[i];
      const div = document.createElement("section");
      div.className = "voice-editor";
      div.innerHTML = `
        <h3>${voice}</h3>
        <div class="note-row">
          <label>Letter
            <select data-field="letter" data-voice="${i}">
              ${["C","D","E","F","G","A","B"].map(x=>`<option ${x===n.letter?"selected":""}>${x}</option>`).join("")}
            </select>
          </label>
          <label>Accidental
            <select data-field="accidental" data-voice="${i}">
              <option value="key" ${n.accidental==="key"?"selected":""}>Key</option>
              <option value="b" ${n.accidental==="b"?"selected":""}>♭ Flat</option>
              <option value="n" ${n.accidental==="n"?"selected":""}>♮ Natural</option>
              <option value="#" ${n.accidental==="#"?"selected":""}>♯ Sharp</option>
            </select>
          </label>
          <label>Octave
            <select data-field="octave" data-voice="${i}">
              ${[2,3,4,5,6].map(x=>`<option value="${x}" ${Number(n.octave)===x?"selected":""}>${x}</option>`).join("")}
            </select>
          </label>
        </div>
      `;
      box.appendChild(div);
    });
  }

  function readEditorChord(){
    const base = state.editingIndex === null ? blankChord() : structuredClone(state.piece.chords[state.editingIndex]);
    document.querySelectorAll("#voiceEditors select").forEach(sel=>{
      const v = Number(sel.dataset.voice);
      const field = sel.dataset.field;
      base.notes[v][field] = field === "octave" ? Number(sel.value) : sel.value;
    });
    base.duration = Number(document.getElementById("durationSelect").value);
    base.label = document.getElementById("labelInput").value.trim();
    return base;
  }

  function openEditor(index=null, insertAt=null){
    state.editingIndex = index;
    state.insertAt = insertAt;
    const chord = index === null ? blankChord() : structuredClone(state.piece.chords[index]);
    buildVoiceEditors(chord);
    document.getElementById("durationSelect").value = String(chord.duration);
    document.getElementById("labelInput").value = chord.label || "";
    document.getElementById("editorTitle").textContent = index === null ? "Add chord" : `Edit chord ${index+1}`;
    document.getElementById("deleteBtn").classList.toggle("hidden", index === null);
    document.getElementById("editorDialog").showModal();
  }

  async function ensureAudio(){
    try{
      if(!state.audioCtx){
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if(!AudioCtx) throw new Error("This browser does not support Web Audio.");
        state.audioCtx = new AudioCtx();
        state.masterGain = state.audioCtx.createGain();
        state.compressor = state.audioCtx.createDynamicsCompressor();
        state.compressor.threshold.value = -24;
        state.compressor.knee.value = 18;
        state.compressor.ratio.value = 4;
        state.compressor.attack.value = 0.003;
        state.compressor.release.value = 0.25;
        state.masterGain.connect(state.compressor).connect(state.audioCtx.destination);
      }

      const volume = Number(document.getElementById("volumeInput")?.value ?? 75) / 100;
      state.masterGain.gain.setTargetAtTime(Math.max(0.001, volume), state.audioCtx.currentTime, 0.01);

      if(state.audioCtx.state !== "running") await state.audioCtx.resume();

      if(!state.audioUnlocked){
        const buffer = state.audioCtx.createBuffer(1, 1, state.audioCtx.sampleRate);
        const source = state.audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(state.masterGain);
        source.start(0);
        state.audioUnlocked = true;
      }

      if(state.audioCtx.state !== "running"){
        throw new Error("Audio is still suspended. Tap Play again and raise the phone volume.");
      }
      return true;
    }catch(err){
      setStatus("Audio could not start: " + (err.message || err));
      return false;
    }
  }

  function stopAudio(){
    state.playToken++;
    state.activeNodes.forEach(n=>{
      try{ n.stop(0); }catch(e){}
      try{ n.disconnect(); }catch(e){}
    });
    state.activeNodes = [];
    document.querySelectorAll(".chord-card").forEach(c=>c.classList.remove("playing"));
    setStatus("Stopped.");
  }

  function makeTone(freq, start, duration, level, detune=0){
    const ctx = state.audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, start);
    osc.detune.setValueAtTime(detune, start);
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(2400, start);
    filter.Q.setValueAtTime(0.7, start);

    const attack = 0.018;
    const decay = Math.min(0.28, duration * 0.22);
    const releaseStart = Math.max(start + attack + decay, start + duration * 0.72);
    const end = start + duration;

    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(level, start + attack);
    gain.gain.exponentialRampToValueAtTime(level * 0.48, start + attack + decay);
    gain.gain.setValueAtTime(level * 0.48, releaseStart);
    gain.gain.exponentialRampToValueAtTime(0.0001, end);

    osc.connect(filter).connect(gain).connect(state.masterGain);
    osc.start(start);
    osc.stop(end + 0.04);
    state.activeNodes.push(osc);
  }

  async function playChord(chord, seconds=1.2){
    const ready = await ensureAudio();
    if(!ready) return false;

    const ctx = state.audioCtx;
    const now = ctx.currentTime + 0.025;
    const duration = Math.max(0.2, seconds);

    chord.notes.forEach((note,i)=>{
      const freq = freqOf(note);
      const level = i === 3 ? 0.18 : (i === 0 ? 0.16 : 0.145);
      makeTone(freq, now + i*0.006, duration, level, 0);
      makeTone(freq * 2, now + i*0.006, duration * 0.72, level * 0.16, i % 2 ? 2 : -2);
    });

    setStatus("Playing " + chord.notes.map(noteText).join(" · "));
    return true;
  }

  async function playSequence(start=0){
    stopAudio();
    const token = ++state.playToken;
    do{
      for(let i=start;i<state.piece.chords.length;i++){
        if(token !== state.playToken) return;
        document.querySelectorAll(".chord-card").forEach(c=>c.classList.remove("playing"));
        const card = document.querySelector(`.chord-card[data-index="${i}"]`);
        if(card) card.classList.add("playing");
        const secs = durationSeconds(state.piece.chords[i].duration);
        await playChord(state.piece.chords[i], Math.max(.18,secs*.93));
        setStatus(`Playing chord ${i+1} of ${state.piece.chords.length}`);
        await new Promise(r=>setTimeout(r,secs*1000));
      }
      start = 0;
    }while(state.loop && token === state.playToken);
    if(token === state.playToken){
      document.querySelectorAll(".chord-card").forEach(c=>c.classList.remove("playing"));
      setStatus("Playback finished.");
    }
  }

  function setStatus(t){ document.getElementById("status").textContent = t; }

  document.getElementById("addChordBtn").addEventListener("click",()=>openEditor(null));
  document.getElementById("cancelBtn").addEventListener("click",()=>document.getElementById("editorDialog").close());
  document.getElementById("saveBtn").addEventListener("click",()=>{
    const chord = readEditorChord();
    if(state.editingIndex !== null) state.piece.chords[state.editingIndex] = chord;
    else if(Number.isInteger(state.insertAt)) state.piece.chords.splice(state.insertAt,0,chord);
    else state.piece.chords.push(chord);
    savePiece(); render(); document.getElementById("editorDialog").close();
  });
  document.getElementById("deleteBtn").addEventListener("click",()=>{
    if(state.editingIndex !== null){
      state.piece.chords.splice(state.editingIndex,1);
      savePiece(); render(); document.getElementById("editorDialog").close();
    }
  });
  document.getElementById("previewBtn").addEventListener("click",()=>playChord(readEditorChord(),1.3));

  document.getElementById("chordList").addEventListener("click",(e)=>{
    const card = e.target.closest(".chord-card");
    if(!card) return;
    const idx = Number(card.dataset.index);
    if(e.target.closest(".play-one")) playChord(state.piece.chords[idx],1.25);
    else if(e.target.closest(".edit-btn")) openEditor(idx);
    else if(e.target.closest(".duplicate-btn")){
      state.piece.chords.splice(idx+1,0,structuredClone(state.piece.chords[idx]));
      savePiece(); render();
    } else if(e.target.closest(".insert-btn")) openEditor(null,idx+1);
  });

  ["keySelect","modeSelect","timeSelect","tempoInput","volumeInput"].forEach(id=>{
    document.getElementById(id).addEventListener("change",()=>{
      state.piece.key = keySelect.value;
      state.piece.mode = document.getElementById("modeSelect").value;
      state.piece.time = document.getElementById("timeSelect").value;
      state.piece.tempo = Number(document.getElementById("tempoInput").value) || 84;
      state.piece.volume = Number(document.getElementById("volumeInput").value) || 0;
      if(state.masterGain && state.audioCtx){
        state.masterGain.gain.setTargetAtTime(Math.max(0.001, state.piece.volume/100), state.audioCtx.currentTime, 0.01);
      }
      savePiece(); render();
    });
  });

  document.getElementById("volumeInput").addEventListener("input",()=>{
    state.piece.volume = Number(document.getElementById("volumeInput").value);
    if(state.masterGain && state.audioCtx){
      state.masterGain.gain.setTargetAtTime(Math.max(0.001, state.piece.volume/100), state.audioCtx.currentTime, 0.01);
    }
    savePiece();
  });

  document.getElementById("playAllBtn").addEventListener("click",()=>playSequence(0));
  document.getElementById("stopBtn").addEventListener("click",stopAudio);
  document.getElementById("loopBtn").addEventListener("click",()=>{state.loop=!state.loop;render()});

  document.getElementById("newPieceBtn").addEventListener("click",()=>{
    if(confirm("Start a new piece? This replaces the current saved progression.")){
      stopAudio(); state.piece = defaultPiece(); savePiece(); render(); setStatus("New piece created.");
    }
  });

  document.getElementById("exportBtn").addEventListener("click",()=>{
    const blob = new Blob([JSON.stringify(state.piece,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "violet-voices-piece.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("importInput").addEventListener("change",async(e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const data = JSON.parse(await file.text());
      if(!Array.isArray(data.chords)) throw new Error("Invalid file");
      state.piece = data;
      savePiece(); render(); setStatus("Piece imported.");
    }catch(err){
      alert("That file could not be imported.");
    }
    e.target.value = "";
  });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  render();
})();
</script>
</body>
</html>
